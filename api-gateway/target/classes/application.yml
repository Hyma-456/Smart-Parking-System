server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: parking-service
          uri: lb://PARKING-SERVICE
          predicates:
            - Path=/parkings/**, /slots/**

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/bookings/**

        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/billings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
